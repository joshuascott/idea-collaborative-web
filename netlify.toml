[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---- Redirects -------------------------------------------------------------
# The previous single-page site used anchor navigation. Anchors are not sent to
# the server, so these catch the handful of places a full path was linked, and
# the client-side shim in the 404 page catches genuine "/#workshops" bookmarks.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/workshops.html"
  to = "/workshops"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/process"
  to = "/#how-we-work"
  status = 301

[[redirects]]
  from = "/realtor"
  to = "/realtors"
  status = 301

[[redirects]]
  from = "/real-estate"
  to = "/realtors"
  status = 301

[[redirects]]
  from = "/assessment"
  to = "/ai-readiness-assessment"
  status = 301

[[redirects]]
  from = "/breakfast"
  to = "/ai-briefing-breakfast"
  status = 301

# ---- Headers ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = """
      default-src 'self'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'self'; \
      object-src 'none'; \
      img-src 'self' data:; \
      font-src 'self'; \
      style-src 'self' 'unsafe-inline'; \
      script-src 'self' 'unsafe-inline' https://plausible.io https://app.cal.com https://cal.com; \
      connect-src 'self' https://plausible.io https://api.cal.com https://app.cal.com; \
      frame-src https://cal.com https://app.cal.com; \
      upgrade-insecure-requests"""

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
